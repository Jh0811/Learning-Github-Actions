name: Advanced GitHub Actions Workflow

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Running Unit Test Cases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit_test_report.xml --cov=./ --cov-report=xml:reports/coverage_report.xml
      - name: Upload Unit Test Report
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: reports/

