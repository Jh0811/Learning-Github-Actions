name: Advanced GitHub Actions Workflow

# ===================================================
# WORKFLOW TRIGGERS
# ===================================================

on:

  # Trigger workflow on push
  push:
    branches:
      - main

  # Trigger workflow on pull request
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Running Unit Test Cases
    runs-on: ubuntu-latest

    steps:

      # Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run unit tests
      - name: Run Unit Tests
        run: pytest -v
