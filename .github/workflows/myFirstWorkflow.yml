name: Advanced GitHub Actions Workflow

# ===================================================
# WORKFLOW TRIGGERS
# ===================================================
on:

  # Trigger workflow on push
  push:
    branches:
      - main
      

  # Trigger workflow on pull request
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Running Unit Test cases
    runs-on: ubuntu-latest
    steps:
      -  name: Checkout code
         run: actions/checkout@v6.0.2
      -  name: Python Set up versions
         run:  actions/setup-python@v6.2.0
         with:
            python-version: '3.10'
      -  name: Install Dependencies
         run:  |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
      -  name: Run Unit Tests
         run: pytest -v 
           
      
         
         
         
         
      


  

  
