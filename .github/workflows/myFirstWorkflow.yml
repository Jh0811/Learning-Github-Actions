name: my-first-work-flow

# To trigger on every push in this repo on any branch
on: push
    schedule:
      - cron: "*/1 * * * *"

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest

    steps:
      - name: Running single command in Job1
        run: echo "This is my first github workflow"

      - name: Checking OS release of Github runner
        run: cat /etc/os-release

      - name: Calling sleep
        run: sleep 20

  job2:
    name: JOB2
    runs-on: ubuntu-latest

    steps:
      - name: Checking the Hostname of the Runner
        run: hostname

      - name: Running multiple commands
        run: |
          echo "Hi, This is Jhalsa"
          echo "Current time is `date`"
          sleep 20

  job3:
    name: JOB3
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Checking single dependency
        run: sleep 10

  job4:
    name: JOB4
    needs: [job1, job2, job3]
    runs-on: ubuntu-latest

    steps:
      - name: Checking multiple dependency
        run: sleep 20
