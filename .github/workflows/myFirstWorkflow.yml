name: Advanced GitHub Actions Workflow

# ---------------------------------------------------
# Workflow Triggers
# ---------------------------------------------------
on:
  push:

  schedule:
    # Runs every 5 minutes
    - cron: "*/5 * * * *"

# ---------------------------------------------------
# Jobs
# ---------------------------------------------------
jobs:

  # =================================================
  # JOB 1 - SYSTEM INFORMATION & ARTIFACT CREATION
  # =================================================
  system-info:
    name: System Information Job
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------
      # Step 1 - Basic System Information
      # ---------------------------------------------
      - name: Display Runner Information
        run: |
          echo "Current Working Directory:"
          pwd

          echo "Listing Files:"
          ls -ltr

          echo "Hostname:"
          hostname

      # ---------------------------------------------
      # Step 2 - Checkout Repository
      # ---------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # Step 3 - Create Artifact Files
      # ---------------------------------------------
      - name: Create Artifacts
        run: |
          echo "GitHub Actions Artifact Demo" > myartifact.txt

          mkdir -p artifacts

          echo "Directory Listing:" > artifacts/lists.txt
          ls -latr >> artifacts/lists.txt

          echo "Hostname Information:" > artifacts/hostname.txt
          hostname >> artifacts/hostname.txt

          echo "Current Date and Time:" > artifacts/date.txt
          date >> artifacts/date.txt

      # ---------------------------------------------
      # Step 4 - Upload Single Artifact
      # ---------------------------------------------
      - name: Upload Single Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single_file
          path: myartifact.txt

      # ---------------------------------------------
      # Step 5 - Upload Artifact Directory
      # ---------------------------------------------
      - name: Upload Artifact Directory
        uses: actions/upload-artifact@v4
        with:
          name: directory_artifacts
          path: artifacts/

      # ---------------------------------------------
      # Step 6 - Upload Multiple Artifacts
      # ---------------------------------------------
      - name: Upload Multiple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multiple_artifacts
          path: |
            myartifact.txt
            artifacts/

      # ---------------------------------------------
      # Step 7 - Upload Artifacts With Exclusions
      # ---------------------------------------------
      - name: Upload Filtered Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filtered_artifacts
          path: |
            myartifact.txt
            artifacts/
            !**/hostname.txt

  # =================================================
  # JOB 2 - DOWNLOAD & VERIFY ARTIFACTS
  # =================================================
  artifact-download:
    name: Artifact Download Job
    runs-on: ubuntu-latest
    needs: system-info

    steps:

      # ---------------------------------------------
      # Step 1 - Verify Current Directory
      # ---------------------------------------------
      - name: Verify Initial Directory
        run: |
          echo "Before Download"
          pwd
          ls -ltr

      # ---------------------------------------------
      # Step 2 - Download Artifact
      # ---------------------------------------------
      - name: Download Single Artifact
        uses: actions/download-artifact@v4
        with:
          name: single_file

      # ---------------------------------------------
      # Step 3 - Verify Downloaded Files
      # ---------------------------------------------
      - name: Verify Downloaded Artifact
        run: |
          echo "After Download"
          pwd
          ls -ltr

          echo "Displaying Artifact Content:"
          cat myartifact.txt

  # =================================================
  # JOB 3 - DEPENDENCY TEST JOB
  # =================================================
  dependency-check:
    name: Dependency Validation Job
    runs-on: ubuntu-latest
    needs:
      - system-info
      - artifact-download

    steps:

      - name: Validate Dependency Execution
        run: |
          echo "All dependent jobs completed successfully"
          echo "Running validation checks..."
          sleep 10

  # =================================================
  # JOB 4 - FINAL EXECUTION JOB
  # =================================================
  final-job:
    name: Final Workflow Job
    runs-on: ubuntu-latest
    needs:
      - system-info
      - artifact-download
      - dependency-check

    steps:

      - name: Final Execution Step
        run: |
          echo "Workflow execution completed successfully"
          echo "Final job is now running"
          date
